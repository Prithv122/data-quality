[project]
name = "data-quality"
version = "0.1.0"
description = "Data quality checks with measured detection power: faults injected at known batches and severities, recall and false alarms per check family, static versus adaptive thresholds."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb==2.0.0",
    "numpy==2.5.3",
    "pandas==3.1.0",
    "pyarrow==25.0.1",
    "pyyaml==6.0.3",
]

# Console entry points need a real build backend: a uv virtual project
# ([tool.uv] package = false) installs nothing, so the documented command fails
# with "No module named ..." even while tests pass (pytest's pythonpath hides it).
[project.scripts]
dq = "dq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dq"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.17.2",
]
# Independent re-implementation of the static rules, used only by the parity gate.
gx = ["great-expectations==1.24.1"]
# 35-lakehouse's table contract, pinned to the shipped commit.
lake = ["lakehouse @ git+https://github.com/Prithv122/lakehouse@50bee72ec2722aa82717ff39c914ac4a4a4c9dc4"]
postgres = ["psycopg[binary]==3.3.6"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q -m 'not postgres'"
markers = [
    "postgres: needs 22-elt-dbt-dagster's Postgres running locally (deselected by default)",
    "slow: runs a full simulated grid",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
